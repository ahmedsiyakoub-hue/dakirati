async function schedRem(r){
 if(!await ensure())return;
 try{
  await unschedRem(r);
  var a=r.t.split(':'),h=+a[0],m=+a[1],now=new Date(),L=[],b=rk(r)*10000,d,i,j;
  if(r.date){
   var p=r.date.split('-');d=new Date(+p[0],p[1]-1,+p[2],h,m,0);
   if(d>now&&!isDone(r,r.date))L.push(mk(r,b+800,d,r.n,r.date));
   if(r.pre){var d1=new Date(d.getTime()-864e5),d2=new Date(d.getTime()-36e5);
    if(d1>now)L.push(mk(r,b+801,d1,tr('غدًا:')+' '+r.n,r.date));
    if(d2>now)L.push(mk(r,b+802,d2,tr('بعد ساعة:')+' '+r.n,r.date))}
  }else{
   for(i=0;i<(r.rep?10:30);i++){
    d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,h,m,0);
    var y=dk(d);if(d<=now||!due(r,d)||isDone(r,y))continue;

function val(id){var e=document.getElementById(id);return e?e.value:''}

 S.rem=S.rem.filter(function(x){return String(x.id)!==String(id)});
 S.homework=S.homework.filter(function(h){return String(h.rid)!==String(id)});save()}
document.addEventListener('click',function(ev){
 var c=ev.target,b=c.closest&&c.closest('button');
 if(c.dataset&&c.dataset.pt!==undefined){var pa=c.dataset.pt.split(','),pp=VCH[+pa[0]]&&VCH[+pa[0]][+pa[1]],ro=document.getElementById('vro');if(pp&&ro)ro.textContent=tr(VM[VF.m][+pa[0]][3])+' — '+pp.d+' — '+pp.y+VU[VF.m];return}
 if(b){var q=b.dataset;

  else if(q.lang)setLang(q.lang);

  else if(q.kc!==undefined){KC=+q.kc;render()}
  else if(q.kw){var kk=S.kids[KC],sw=sun(new Date());if(q.kw==='B')sw.setDate(sw.getDate()-7);kk.ref=sw.getTime();save();render();schedEve()}
  else if(q.delkid)delKidAt(KC);
  else if(q.cdel){PD=null;render()}
  else if(q.dkid!==undefined)delKidAt(+q.dkid);
  else if(q.ekid!==undefined){KC=+q.ekid;SD=null;view='ked';render()}
  else if(q.ed){SD=(SD===q.ed)?null:q.ed;LASTT='08:00';render()}
  else if(q.al){
   var ka=q.al.split(','),dd2=S.kids[KC].weeks[ka[0]][+ka[1]],sn=val('ls_s').trim();
   if(!sn){alert('أدخل المادة الدراسية');return}
   var ff=val('ls_f'),tt2=val('ls_t');dd2.ls.push({s:sn,f:ff,to:tt2});
   dd2.ls.sort(function(a,b){return(a.f||'99')<(b.f||'99')?-1:(a.f||'99')>(b.f||'99')?1:0});
   dd2.on=true;LASTT=tt2||ff||'08:00';save();render();schedEve()}
  else if(q.dl){var kl=q.dl.split(','),d3=S.kids[KC].weeks[kl[0]][+kl[1]];d3.ls.splice(+kl[2],1);save();render();schedEve()}
  else if(q.v){gStop();view=q.v;PD=null;if(q.v==='g_mem'&&!MM.c.length)MM.n=MM.n||6;if(q.v==='g_48'&&!G48.b.length)g48New();render();if(q.v==='xo')xKick();if(q.v==='g_c4')c4Kick()}
  else if(q.enl){EN.lv=q.enl;EN.scr='menu';EQ.items=[];render()}
  else if(q.enb){if(EQ.items.length)EQ.items=[];else if(EN.scr==='gram'&&EN.gt>=0)EN.gt=-1;else if(EN.scr!=='menu')EN.scr='menu';else EN.lv='';render()}
  else if(q.ens){EN.scr=q.ens;EN.gt=-1;if(q.ens==='sent'){SB.i=0;sbNew()}render()}
  else if(q.ecat){EN.cat=q.ecat;render()}
  else if(q.ltr!==undefined){EN.ltr=+q.ltr;render();var a0=ALPHA[EN.ltr];speak(String.fromCharCode(65+EN.ltr)+'. '+a0[0])}
  else if(q.sp)speak(q.sp)
  else if(q.egt!==undefined){EN.gt=+q.egt;render()}

  else if(q.eqa!==undefined)eqAns(+q.eqa)
  else if(q.eqn)eqNext()
  else if(q.esw!==undefined){var pw=SB.pool[+q.esw];if(pw&&!pw.u&&SB.ok!==true){pw.u=true;SB.built.push(+q.esw);SB.ok=null;sbCheck();render()}}

  else if(q.esn){SB.i++;sbNew();render()}

  else if(q.ml)mNew(+q.ml)

  else if(q.ga!==undefined)gmAns(+q.ga)

   if(F.type!=='o'&&!F.days.length){alert('اختر يومًا واحدًا على الأقل');return}

   S.homework.push({title:title,subject:sj,dueDate:dd,t:tm,rid:r2.id});S.rem.push(r2);save();render();schedRem(r2)}
  else if(q.delhw!==undefined){var hw=S.homework[+q.delhw];if(hw)delRem(hw.rid);else S.homework.splice(+q.delhw,1);save();render()}
  else if(q.setpin){var pin=val('new_pin');if(pin.length>=4){S.vault.pin=pin;vaultUnlocked=true;save();render()}else alert('4 أرقام على الأقل')}
  else if(q.unlock){if(val('enter_pin')===S.vault.pin){vault_info');save();alert('تم الحفظ')}

   ICE_EDIT=-1;save();render();alert('تم حفظ البطاقة')}
  else if(q.editice!==undefined){ICE_EDIT=+q.editice;render()}
  else if(q.cancelice){ICE_EDIT=-1;render()}

 }

function onField(ev){

 else if(q.eve==='t'){S.eve.t=c.value||'20:00';save();schedEve()}
 else if(q.done!==undefined&&c.type==='checkbox'){var r=findRem(q.done);if(r){if(c.checked)markDone(r,dk(new Date()));else unmark(r,dk(new Date()));render()}}}
