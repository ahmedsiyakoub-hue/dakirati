<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول ابني - المنظومة الشاملة</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ac:#1d6f5f;--acs:#dff1ec;--off:#e9e7e1;--bd:#e3e1da;--wr:#b45309;--danger:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#1f2326;--tx:#ececec;--mut:#9aa3ab;--ac:#4fc3a8;--acs:#1e3a34;--off:#2a2f33;--bd:#2f353a;--wr:#fbbf24;--danger:#ef4444;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
.w{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.big{font-size:22px;font-weight:700;margin:4px 0}.s17{font-size:17px}
.badge{display:inline-block;background:var(--acs);color:var(--ac);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
.on{color:var(--ac)}.offt{color:var(--mut)}.wr{color:var(--wr);font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button,.btn{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 6px;font:inherit;font-weight:600;font-size:13px;white-space:nowrap}
.tabs button.a,.btn.p,.chips button.a{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}.dot.o{background:var(--off)}
.day{width:70px;flex:none;font-weight:600}
.sub{color:var(--mut);font-size:14px;flex:1}
.today{background:var(--acs);border-radius:10px;padding-inline:8px;margin-inline:-8px}
input[type=text],input[type=time],input[type=date],input[type=number],input[type=password],select,textarea{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px;font:inherit;min-width:0}
input[type=text],textarea{flex:1;width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.hint{color:var(--mut);font-size:13px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px}
.done{text-decoration:line-through;color:var(--mut)}
.mt{margin-top:8px}
.sos-btn{background:var(--danger);color:#fff;font-size:17px;font-weight:bold;padding:12px;border-radius:14px;width:100%;border:none;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-bottom:10px}
.ice-card{border:2px solid var(--danger);background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
var D=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],N={A:'الأسبوع «أ»',B:'الأسبوع «ب»'};
var S=null,view='home',msg='',ready=null,vaultUnlocked=false;
var F={type:'d',t:'08:00',n:'',w:'',date:'',days:[0,1,2,3,4,5,6],wk:'',pre:true,rep:true,st:'',ln:'',li:''};

function blank(){var o={};for(var i=0;i<7;i++)o[i]={on:false,t:''};return o}
function fix(){
 S.weeks=S.weeks||{A:blank(),B:blank()};
 S.rem=S.rem||[];
 S.log=S.log||{};
 S.vitals=S.vitals||[];
 S.homework=S.homework||[];
 S.vault=S.vault||{pin:'',info:''};
 S.sos=S.sos||{name:'الطوارئ',phone:''};
 S.ice=S.ice||{name:'',blood:'',allergies:'',notes:''};
 if(S.ref===undefined)S.ref=null
}
try{S=JSON.parse(localStorage.getItem('edt'))}catch(e){}
if(!S||typeof S!=='object')S={};fix();
function save(){try{localStorage.setItem('edt',JSON.stringify(S))}catch(e){}}
function sun(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function wt(d){var w=Math.round((sun(d)-new Date(S.ref))/604800000);return(((w%2)+2)%2===0)?'A':'B'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return(n<10?'0':'')+n}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dnS(s){var p=s.split('-');return Math.floor(Date.UTC(+p[0],p[1]-1,+p[2])/864e5)}
function dn(d){return dnS(dk(d))}
function setThis(type){var s=sun(new Date());if(type==='B')s.setDate(s.getDate()-7);S.ref=s.getTime();save();view='home';render();schedEve()}
function due(r,d){
 if(r.date)return dk(d)===r.date;
 if(r.c&&dk(d)<r.c)return false;
 if(r.days&&r.days.indexOf(d.getDay())<0)return false;
 if(r.wk&&S.ref!==null&&wt(d)!==r.wk)return false;
 return true
}
function sortedRem(l){return l.slice().sort(function(a,b){return a.t<b.t?-1:a.t>b.t?1:0})}
function isDone(r,k){return !!(S.log[k]&&S.log[k][r.id])}
function findRem(id){return S.rem.filter(function(r){return String(r.id)===String(id)})[0]}
function rk(r){if(!r.k){S.seq=(S.seq||0)+1;r.k=S.seq;save()}return r.k}
function tt(r){return r.w?'⏰ '+r.w:'⏰ تذكير دواء'}

/* ---------- notifications ---------- */
var CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()),LN=null;
if(NATIVE){try{LN=(CAP.Plugins&&CAP.Plugins.LocalNotifications)||(CAP.registerPlugin?CAP.registerPlugin('LocalNotifications'):null)}catch(e){}}
function say(m){msg=m;var el=document.getElementById('ns');if(el)el.textContent=m}
function ensure(){
 if(!LN)return Promise.resolve(false);
 if(!ready)ready=(async function(){
  var p=await LN.requestPermissions();if(p.display!=='granted')return false;
  try{await LN.createChannel({id:'meds',name:'التذكيرات والأدوية',importance:5,vibration:true,visibility:1})}catch(e){}
  try{await LN.registerActionTypes({types:[{id:'REM',actions:[{id:'done',title:'✓ تم'},{id:'snooze',title:'⏰ بعد 10 دقائق'}]}]})}catch(e){}
  return true})();
 return ready
}
function mk(r,id,at,body,day){return{id:id,title:tt(r),body:body,channelId:'meds',actionTypeId:'REM',extra:{rid:r.id,day:day},schedule:{at:at,allowWhileIdle:true}}}
async function unschedRem(r){
 if(!LN)return;
 try{var ids=[],b=rk(r)*10000,i;for(i=0;i<1000;i++)ids.push({id:b+i});await LN.cancel({notifications:ids})}catch(e){}}
async function schedRem(r){
 if(!await ensure())return;
 try{
  await unschedRem(r);
  var a=r.t.split(':'),h=+a[0],m=+a[1],now=new Date(),L=[],b=rk(r)*10000,d,i,j;
  if(r.date){
   var p=r.date.split('-');d=new Date(+p[0],p[1]-1,+p[2],h,m,0);
   if(d>now)L.push(mk(r,b+800,d,r.n,r.date));
  }else{
   var days=14;
   for(i=0;i<days;i++){
    d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,h,m,0);
    var y=dk(d);
    if(d <= now) continue;
    if(!due(r,d) || isDone(r,y)) continue;
    var baseId=b + (i * 20);
    L.push(mk(r, baseId, d, r.n, y));
    if(r.rep){
     for(j=1; j<=3; j++){
      var repeatTime = new Date(d.getTime() + j * 6e5);
      if(repeatTime > now) L.push(mk(r, baseId + j, repeatTime, '(تنبيه متكرر) ' + r.n, y));
     }
    }
   }
  }
  if(L.length)await LN.schedule({notifications:L});
 }catch(e){}}

async function schedEve(){
 if(!LN||S.ref===null)return;
 if(!await ensure())return;
 try{
  var ids=[],i;for(i=0;i<14;i++)ids.push({id:1900000000+i});await LN.cancel({notifications:ids});
  if(!S.eve.on)return;
  var a=S.eve.t.split(':'),now=new Date(),L=[];
  for(i=0;i<14;i++){
   var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,+a[0],+a[1],0);if(d<=now)continue;
   var g=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1),x=S.weeks[wt(g)][g.getDay()];
   L.push({id:1900000000+dn(d)%14,title:'📚 المدرسة',body:'غدًا ('+D[g.getDay()]+') '+(x.on?'يدرس'+(x.t?' — '+x.t:''):'عطلة'),channelId:'meds',schedule:{at:d,allowWhileIdle:true}})}
  if(L.length)await LN.schedule({notifications:L})
 }catch(e){}}

async function cancelFollow(r,day){if(!LN)return;try{await unschedRem(r);await schedRem(r);}catch(e){}}
function markDone(r,day){S.log[day]=S.log[day]||{};if(S.log[day][r.id])return;S.log[day][r.id]=true;save();cancelFollow(r,day)}
function unmark(r,day){if(S.log[day]&&S.log[day][r.id]){S.log[day][r.id]=false;save()}}

async function init(){
 if(!LN)return;
 for(var i=0;i<S.rem.length;i++)await schedRem(S.rem[i]);
 await schedEve()
}

/* ---------- UI VIEWS ---------- */
function chip(attr,label,on){return'<button '+attr+(on?' class="a"':'')+'>'+label+'</button>'}

function homeView(now,t){
 var e=S.weeks[t][now.getDay()],k=dk(now);
 var h='';

 // 1. عرض بطاقة الطوارئ الطبية بارزة في الأعلى إذا تم ملؤها
 if(S.ice.name){
  h+='<div class="ice-card"><div class="big s17" style="color:var(--danger)">🪪 بطاقة التعريف الطبية (ICE)</div>';
  h+='<div><b>الاسم:</b> '+esc(S.ice.name)+' | <b>فصيلة الدم:</b> '+esc(S.ice.blood||'غير محدد')+'</div>';
  if(S.ice.allergies)h+='<div><b>الحساسية:</b> '+esc(S.ice.allergies)+'</div>';
  if(S.ice.notes)h+='<div><b>ملاحظات:</b> '+esc(S.ice.notes)+'</div>';
  h+='</div>';
 }

 // 2. زر الطوارئ السريع بارز
 if(S.sos.phone){
  h+='<a href="tel:'+esc(S.sos.phone)+'" style="text-decoration:none"><button class="sos-btn">🚨 اتصال طوارئ سريع بـ ('+esc(S.sos.name')+')</button></a>';
 }

 h+='<div class="card"><span class="badge">'+N[t]+'</span><div class="big">'+D[now.getDay()]+' '+now.getDate()+'/'+(now.getMonth()+1)+'</div>';
 h+=e.on?'<div class="big on">✓ يدرس اليوم</div>':'<div class="big offt">لا يدرس اليوم</div>';
 if(e.on&&e.t)h+='<div>'+esc(e.t)+'</div>';
 h+='</div>';

 var L=sortedRem(S.rem.filter(function(r){return due(r,now)}));
 h+='<div class="card"><div class="big s17">⏰ تذكيراتي اليوم</div>';
 if(!L.length)h+='<p class="hint">لا تذكيرات اليوم.</p>';
 L.forEach(function(r){var d=isDone(r,k);h+='<label class="row"><input type="checkbox" data-done="'+r.id+'" '+(d?'checked':'')+'><span class="day" style="width:58px">'+r.t+'</span><span class="sub'+(d?' done':'')+'">'+esc(r.n)+(r.w?' ('+esc(r.w)+')':'')+'</span></label>'});
 h+='</div>';
 return h;
}

function vitalsView(){
 var h='<div class="card"><div class="big s17">📊 سجل القياسات الحيوية</div>';
 h+='<div class="row"><input type="number" id="v_sys" placeholder="الضغط العالي (مثلاً 120)"><input type="number" id="v_dia" placeholder="الضغط المنخفض (80)"></div>';
 h+='<div class="row"><input type="number" id="v_glu" placeholder="السكر (مغ/دسل)"><input type="number" step="0.1" id="v_temp" placeholder="الحرارة (م°)"></div>';
 h+='<div class="row"><input type="number" step="0.1" id="v_weight" placeholder="الوزن (كغ)"></div>';
 h+='<button class="btn p mt" data-addvital="1" style="width:100%">+ تسجيل القياس</button></div>';

 h+='<div class="card"><div class="big s17">السجلات الأخيرة</div>';
 if(!S.vitals.length)h+='<p class="hint">لا توجد قياسات مسجلة.</p>';
 S.vitals.slice().reverse().forEach(function(v,idx){
  h+='<div class="row"><span class="sub"><b>'+v.date+'</b><br>';
  if(v.sys)h+='ضغط: '+v.sys+'/'+v.dia+' | ';
  if(v.glu)h+='سكر: '+v.glu+' | ';
  if(v.temp)h+='حرارة: '+v.temp+'° | ';
  if(v.weight)h+='وزن: '+v.weight+'كغ';
  h+='</span><button class="btn danger" style="flex:none" data-delvital="'+(S.vitals.length-1-idx)+'">حذف</button></div>';
 });
 h+='<button class="btn mt" data-expvitals="1" style="width:100%">💾 تصدير سجل القياسات كملف</button>';
 h+='</div>';
 return h;
}

function homeworkView(){
 var h='<div class="card"><div class="big s17">📚 منبه الواجبات المدرسية</div>';
 h+='<div class="row"><input type="text" id="hw_title" placeholder="عنوان الواجب (مثلاً: تمارين الرياضيات)"></div>';
 h+='<div class="row"><input type="text" id="hw_subject" placeholder="المادة الدراسية"></div>';
 h+='<div class="row"><span>تاريخ التسليم:</span><input type="date" id="hw_date"><input type="time" id="hw_time" value="18:00"></div>';
 h+='<button class="btn p mt" data-addhw="1" style="width:100%">+ إضافة واجب وتنبيه</button></div>';

 h+='<div class="card"><div class="big s17">قائمة الواجبات</div>';
 if(!S.homework.length)h+='<p class="hint">لا توجد واجبات حالية.</p>';
 S.homework.forEach(function(hw,i){
  h+='<div class="row"><span class="sub"><b>'+esc(hw.title)+'</b> ('+esc(hw.subject)+')<br><small class="offt">تسليم: '+hw.dueDate+' الساعة '+hw.t+'</small></span>';
  h+='<button class="btn danger" style="flex:none" data-delhw="'+i+'">تم / حذف</button></div>';
 });
 h+='</div>';
 return h;
}

function vaultView(){
 var h='<div class="card"><div class="big s17">🔒 صندوق المعلومات المهمة</div>';
 if(!S.vault.pin){
  h+='<p class="hint">أنشئ كوداً سرياً لحماية معلوماتك الحساسة:</p>';
  h+='<div class="row"><input type="password" id="new_pin" placeholder="أدخل كود سري من 4 أرقام"></div>';
  h+='<button class="btn p mt" data-setpin="1" style="width:100%">حفظ الكود السري</button></div>';
  return h;
 }
 if(!vaultUnlocked){
  h+='<div class="row"><input type="password" id="enter_pin" placeholder="أدخل الكود السري لفتح الصندوق"></div>';
  h+='<button class="btn p mt" data-unlock="1" style="width:100%">🔓 فتح الصندوق</button></div>';
  return h;
 }
 h+='<p class="hint">الصندوق مفتوح:</p>';
 h+='<textarea id="vault_info" rows="5" placeholder="أرقام التأمين، فصائل الدم، ملاحظات خاصة...">'+esc(S.vault.info)+'</textarea>';
 h+='<div class="row"><button class="btn p" data-savevault="1">حفظ المعلومات</button><button class="btn" data-lock="1">🔒 إغلاق الصندوق</button></div></div>';
 return h;
}

function settingsView(){
 var h='<div class="card"><div class="big s17">🚨 إعدادات زر الطوارئ السريع</div>';
 h+='<div class="row"><input type="text" id="sos_name" placeholder="اسم جهة الاتصال (مثلاً الابن / الطبيب)" value="'+esc(S.sos.name)+'"></div>';
 h+='<div class="row"><input type="text" id="sos_phone" placeholder="رقم الهاتف (مثلاً 0661000000)" value="'+esc(S.sos.phone)+'"></div>';
 h+='<button class="btn p mt" data-savesos="1" style="width:100%">حفظ إعدادات الطوارئ</button></div>';

 h+='<div class="card"><div class="big s17">🪪 بطاقة التعريف الطبية (ICE)</div>';
 h+='<div class="row"><input type="text" id="ice_name" placeholder="الاسم الكامل" value="'+esc(S.ice.name)+'"></div>';
 h+='<div class="row"><input type="text" id="ice_blood" placeholder="فصيلة الدم (مثلاً O+)" value="'+esc(S.ice.blood)+'"></div>';
 h+='<div class="row"><input type="text" id="ice_allergies" placeholder="الحساسية (أدوية، أطعمة)" value="'+esc(S.ice.allergies)+'"></div>';
 h+='<div class="row"><textarea id="ice_notes" rows="2" placeholder="ملاحظات صحية حرجة...">'+esc(S.ice.notes)+'</textarea></div>';
 h+='<button class="btn p mt" data-saveice="1" style="width:100%">حفظ بطاقة ICE</button></div>';
 return h;
}

function remForm(){
 var o=F.type==='o',h='<div class="card"><div class="big s17">➕ تذكير جديد</div><div class="row"><select data-f="type"><option value="d"'+(o?'':' selected')+'>متكرر</option><option value="o"'+(o?' selected':'')+'>موعد مرة واحدة</option></select>';
 if(o)h+='<input type="date" data-f="date" value="'+F.date+'">';
 h+='<input type="time" data-f="t" value="'+F.t+'"></div><div class="row"><input type="text" data-f="n" placeholder="اسم الدواء أو المهمة" value="'+esc(F.n)+'"></div>';
 if(!o){
  h+='<div class="hint">الأيام:</div><div class="chips">';
  D.forEach(function(x,i){h+=chip('data-day="'+i+'"',x,F.days.indexOf(i)>=0)});
  h+='</div><label class="row"><input type="checkbox" data-f="rep" '+(F.rep?'checked':'')+'><span>تكرار التنبيه كل 10 دقائق حتى يلغى</span></label>';
 }
 return h+'<button class="btn p mt" data-add="1" style="width:100%">+ إضافة</button></div>';
}

function render(){
 var el=document.getElementById('app');
 if(S.ref===null){
  el.innerHTML='<h1>جدول ابني</h1><div class="card"><div class="big">أي أسبوع نحن فيه الآن؟</div><div class="tabs"><button data-set="A">الأسبوع «أ»</button><button data-set="B">الأسبوع «ب»</button></div></div>';
  return;
 }
 var now=new Date(),t=wt(now);
 var h='<h1>جدول ابني المنظومة الشاملة</h1><div class="tabs">';
 [['home','الرئيسية'],['vitals','القياسات'],['hw','الواجبات'],['vault','الصندوق'],['rem','التذكيرات'],['set','الإعدادات']].forEach(function(x){
  h+='<button data-v="'+x[0]+'" class="'+(view===x[0]?'a':'')+'">'+x[1]+'</button>';
 });
 h+='</div>';

 if(view==='home') h+=homeView(now,t);
 else if(view==='vitals') h+=vitalsView();
 else if(view==='hw') h+=homeworkView();
 else if(view==='vault') h+=vaultView();
 else if(view==='rem') h+=remForm();
 else if(view==='set') h+=settingsView();

 el.innerHTML=h;
}

/* ---------- EVENT LISTENERS ---------- */
document.addEventListener('click',function(ev){
 var c=ev.target,b=c.closest&&c.closest('button');
 if(b){var q=b.dataset;
  if(q.set)setThis(q.set);
  else if(q.v){view=q.v;render()}
  else if(q.addvital){
   var sys=document.getElementById('v_sys').value, dia=document.getElementById('v_dia').value;
   var glu=document.getElementById('v_glu').value, temp=document.getElementById('v_temp').value, weight=document.getElementById('v_weight').value;
   if(!sys&&!glu&&!temp&&!weight)return;
   S.vitals.push({date:dk(new Date())+' '+new Date().toLocaleTimeString().slice(0,5),sys:sys,dia:dia,glu:glu,temp:temp,weight:weight});
   save();render();
  }
  else if(q.delvital!==undefined){S.vitals.splice(+q.delvital,1);save();render()}
  else if(q.expvitals){
   var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S.vitals,null,2));
   var dlAnchorElem = document.createElement('a');
   dlAnchorElem.setAttribute("href",     dataStr     );
   dlAnchorElem.setAttribute("download", "vitals_log.json");
   dlAnchorElem.click();
  }
  else if(q.addhw){
   var title=document.getElementById('hw_title').value, subject=document.getElementById('hw_subject').value;
   var dueDate=document.getElementById('hw_date').value, time=document.getElementById('hw_time').value;
   if(!title||!dueDate)return;
   var r={id:Date.now()%2000000000,t:time,n:'📚 واجب: '+title+' ('+subject+')',date:dueDate,pre:true};
   S.homework.push({title:title,subject:subject,dueDate:dueDate,t:time});
   S.rem.push(r);save();schedRem(r);render();
  }
  else if(q.delhw!==undefined){S.homework.splice(+q.delhw,1);save();render()}
  else if(q.setpin){
   var pin=document.getElementById('new_pin').value;
   if(pin.length>=4){S.vault.pin=pin;vaultUnlocked=true;save();render()}
  }
  else if(q.unlock){
   var pin2=document.getElementById('enter_pin').value;
   if(pin2===S.vault.pin){vaultUnlocked=true;render()}else alert('كود سري خاطئ!');
  }
  else if(q.lock){vaultUnlocked=false;render()}
  else if(q.savevault){
   S.vault.info=document.getElementById('vault_info').value;save();alert('تم حفظ البيانات بنجاح!');
  }
  else if(q.savesos){
   S.sos.name=document.getElementById('sos_name').value;
   S.sos.phone=document.getElementById('sos_phone').value;
   save();render();alert('تم حفظ رقم الطوارئ!');
  }
  else if(q.saveice){
   S.ice.name=document.getElementById('ice_name').value;
   S.ice.blood=document.getElementById('ice_blood').value;
   S.ice.allergies=document.getElementById('ice_allergies').value;
   S.ice.notes=document.getElementById('ice_notes').value;
   save();render();alert('تم حفظ بطاقة ICE الطبية!');
  }
  else if(q.add){
   var r={id:Date.now()%2000000000,t:F.t||'08:00',n:(F.n||'').trim()||'تذكير',c:dk(new Date())};
   if(F.type==='o'){r.date=F.date}else{r.days=F.days.slice();r.rep=!!F.rep}
   S.rem.push(r);save();schedRem(r);render();
  }
  return;
 }
 if(c.type==='checkbox'&&c.dataset.done){
  var r2=findRem(c.dataset.done);if(r2){if(c.checked)markDone(r2,dk(new Date()));else unmark(r2,dk(new Date()));render()}
 }
});

render();init();
</script>
